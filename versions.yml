project:
  version: "0.1.3"
  last_reviewed: "2026-08-18"

os:
  ubuntu:
    primary: "24.04"
    supported:
      - "24.04"

python:
  minimum: "3.12"
  install_policy: "ubuntu-package"
  package: "python3"

time_sync:
  fallback: "chrony"
  ntp_probe_timeout_seconds: 2
  synchronization_wait_seconds: 60
  providers:
    - "time.cloudflare.com"
    - "time.google.com"
    - "ntp.ubuntu.com"
    - "pool.ntp.org"

ansible:
  status: "foundation-only"
  install_policy: "not-installed-in-v0.1.3"
  notes: "Future provisioning modules may add a pinned ansible-core dependency after VPS validation."

xray:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"

three_x_ui:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"
  notes: "PostgreSQL preferred for new installs only after target version compatibility is verified."

postgresql:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"

caddy_naiveproxy:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"

warp:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"

telegram_monitoring:
  status: "not-installed-in-v0.1.3"
  install_policy: "future-pinned"
